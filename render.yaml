# Render Blueprint: Arthik as a free static site, served from the root of its onrender.com address.
# GitHub Pages serves the same app under /arthik/; here BASE_PATH=/ builds it for the root.
services:
  - type: web
    name: arthik
    runtime: static
    # --include=dev: the build needs tsc and vite, which are dev dependencies, even if Render
    # sets NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: BASE_PATH
        value: /
      - key: NODE_VERSION
        value: "24"
    headers:
      # The page and the service worker must always be fetched fresh, so an update reaches
      # visitors instead of an old copy staying in their browser.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Built files have a content hash in their names, so they can be kept for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
